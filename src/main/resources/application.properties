# SPARK Java Spring Boot Backend Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# Application Name
spring.application.name=spark-backend

# MongoDB Connection Configuration (Optional)
# Set MONGODB_URI in environment or application.properties
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/spark_db}

# Google Gemini API Key
gemini.api.key=${GEMINI_API_KEY:}

# Enable Jackson Formatting for JSON API Responses
spring.jackson.serialization.indent-output=true
